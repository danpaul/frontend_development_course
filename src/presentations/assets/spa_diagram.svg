<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="2560" height="1240" role="img" aria-labelledby="title desc">
  <title id="title">Classic SPA request flow</title>
  <desc id="desc">First visit downloads a JS bundle, boots React, then fetches data from a separate API before painting. Later clicks stay on the same HTML page: the client router loads a component, optionally fetches data, and updates the DOM without a full reload.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#d4d4d4"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1280" height="620" fill="#222222"/>

  <!-- Left column header -->
  <text x="300" y="38" text-anchor="middle" fill="#f5f5f5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700">1. First visit</text>
  <text x="300" y="60" text-anchor="middle" fill="#a3a3a3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14">Server sends a JS bundle, not a finished page</text>

  <!-- Left boxes -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <rect x="50" y="78" width="500" height="66" rx="10" fill="#2d2d2d" stroke="#a1a1a1" stroke-width="1.5"/>
    <text x="300" y="118" fill="#f5f5f5" font-size="18">User visits the website</text>

    <line x1="300" y1="144" x2="300" y2="170" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="50" y="174" width="500" height="66" rx="10" fill="#2d2d2d" stroke="#a1a1a1" stroke-width="1.5"/>
    <text x="300" y="202" fill="#f5f5f5" font-size="18">Browser loads index.html + JS bundle</text>
    <text x="300" y="224" fill="#a3a3a3" font-size="13">empty HTML shell - the app is still in JavaScript</text>

    <line x1="300" y1="240" x2="300" y2="266" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="50" y="270" width="500" height="66" rx="10" fill="#2d2d2d" stroke="#a1a1a1" stroke-width="1.5"/>
    <text x="300" y="310" fill="#f5f5f5" font-size="18">React boots in the browser</text>

    <line x1="300" y1="336" x2="300" y2="362" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="368" y="352" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="start">second request</text>

    <rect x="50" y="366" width="500" height="66" rx="10" fill="#3a3118" stroke="#fbbf24" stroke-width="2"/>
    <text x="300" y="394" fill="#f5f5f5" font-size="18">Fetch data from a separate API</text>
    <text x="300" y="416" fill="#fcd34d" font-size="13">nothing useful to paint until this returns</text>

    <line x1="300" y1="432" x2="300" y2="458" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="50" y="462" width="500" height="66" rx="10" fill="#2d2d2d" stroke="#a1a1a1" stroke-width="1.5"/>
    <text x="300" y="502" fill="#f5f5f5" font-size="18">React paints the UI</text>
  </g>

  <!-- Connector between columns -->
  <path d="M 550 495 H 610 V 111 H 720" fill="none" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="545" y="282" width="130" height="28" rx="14" fill="#2d2d2d" stroke="#737373" stroke-width="1"/>
  <text x="610" y="301" text-anchor="middle" fill="#d4d4d4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12">keeps browsing</text>

  <!-- Right column header -->
  <text x="970" y="38" text-anchor="middle" fill="#f5f5f5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700">2. Later clicks</text>
  <text x="970" y="60" text-anchor="middle" fill="#a3a3a3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14">Same HTML page - the client does the rest</text>

  <!-- Right boxes -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <rect x="730" y="78" width="480" height="66" rx="10" fill="#2d2d2d" stroke="#a1a1a1" stroke-width="1.5"/>
    <text x="970" y="118" fill="#f5f5f5" font-size="18">User clicks a link</text>

    <line x1="970" y1="144" x2="970" y2="170" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1036" y="160" fill="#a3a3a3" font-size="12" text-anchor="start">no full navigation</text>

    <rect x="730" y="174" width="480" height="66" rx="10" fill="#2d2d2d" stroke="#a1a1a1" stroke-width="1.5"/>
    <text x="970" y="202" fill="#f5f5f5" font-size="18">Client-side router intercepts</text>
    <text x="970" y="224" fill="#a3a3a3" font-size="13">the browser never requests a new HTML page</text>

    <line x1="970" y1="240" x2="970" y2="266" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="730" y="270" width="480" height="66" rx="10" fill="#2d2d2d" stroke="#a1a1a1" stroke-width="1.5"/>
    <text x="970" y="310" fill="#f5f5f5" font-size="18">Load the new component via JS</text>

    <line x1="970" y1="336" x2="970" y2="362" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="1036" y="352" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="start">optional</text>

    <rect x="730" y="366" width="480" height="66" rx="10" fill="#3a3118" stroke="#fbbf24" stroke-width="2"/>
    <text x="970" y="394" fill="#f5f5f5" font-size="18">Fetch data from the API</text>
    <text x="970" y="416" fill="#fcd34d" font-size="13">another round trip before the new view is ready</text>

    <line x1="970" y1="432" x2="970" y2="458" stroke="#d4d4d4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="730" y="462" width="480" height="66" rx="10" fill="#16352c" stroke="#34d399" stroke-width="2"/>
    <text x="970" y="494" fill="#f5f5f5" font-size="17">Update the DOM - no full page reload</text>
  </g>

  <!-- Repeat loop -->
  <path d="M 1210 495 H 1248 V 111 H 1210" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <rect x="1222" y="282" width="52" height="24" rx="12" fill="#16352c" stroke="#34d399" stroke-width="1.5"/>
  <text x="1248" y="298" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700">repeat</text>

  <!-- Caption -->
  <text x="640" y="562" text-anchor="middle" fill="#a3a3a3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14">The SPA never asks the server for a new HTML page after the first visit - only JavaScript and API data.</text>
  <text x="640" y="584" text-anchor="middle" fill="#8a8a8a" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13">That extra API round trip before first paint is the cost Next.js is built to avoid.</text>
</svg>
