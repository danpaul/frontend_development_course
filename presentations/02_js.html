</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-scope-Q6OVdCpu="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="45" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="object-destructuring">Object Destructuring</h2>
<p>Object destructuring allows us to pluck properties out of objects and turn them into variables.</p>
<p>This is commonly used when methods are returning multiple values or if we want to make our code more readable.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> cake = {
  <span class="hljs-attr">cakeName</span>: <span class="hljs-string">&quot;Eat Me cake&quot;</span>,
  <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;pastry&quot;</span>,
  <span class="hljs-attr">isSweet</span>: <span class="hljs-literal">true</span>,
};

<span class="hljs-comment">// destructuring the object</span>
<span class="hljs-keyword">const</span> { cakeName, isSweet } = cake;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`The <span class="hljs-subst">${cakeName}</span> is sweet: `</span>, isSweet);
<span class="hljs-comment">// ~&gt; The Eat Me cake is sweet:  true</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="46" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="destructuring-function-arguments">Destructuring function arguments</h2>
<p>React components receive one argument: a <code>props</code> object. Destructuring it in the parameter list turns those properties into local variables.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-jsx"><span class="hljs-comment">// without destructuring</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">Welcome</span>(<span class="hljs-params">props</span>) {
  <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Welcome to Wonderland, {props.name}!<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span></span>;
}

<span class="hljs-comment">// with destructuring</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">Welcome</span>(<span class="hljs-params">{ name }</span>) {
  <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Welcome to Wonderland, {name}!<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span></span>;
}

&lt;<span class="hljs-title class_">Welcome</span> name=<span class="hljs-string">&quot;Alice&quot;</span> /&gt;;
</code></pre>
<p>Same idea as the cake — pluck the properties you need, skip the rest.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="47" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="array-destructuring">Array Destructuring</h2>
<p>Arrays can also be destructured:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> seats = [<span class="hljs-string">&quot;Mad Hatter&quot;</span>, <span class="hljs-string">&quot;March Hare&quot;</span>];
<span class="hljs-keyword">const</span> [hatter, hare] = seats;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`The first seat belongs to the <span class="hljs-subst">${hatter}</span>`</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="48" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="spread-operator">Spread operator</h2>
<p>The spread operator (<code>...</code>) can be used to flatten objects and arrays and &quot;spread&quot; the properties into new objects or arrays.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> guest = { <span class="hljs-attr">place</span>: <span class="hljs-string">&quot;tea party&quot;</span>, <span class="hljs-attr">isLate</span>: <span class="hljs-literal">false</span> };

<span class="hljs-comment">// spread guest properties into the Hatter</span>
<span class="hljs-keyword">const</span> hatter = { ...guest, <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Mad Hatter&quot;</span> };

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(hatter.<span class="hljs-property">place</span>); <span class="hljs-comment">// ~&gt; tea party</span>

<span class="hljs-keyword">let</span> guests = [hatter];

<span class="hljs-comment">// spread guest elements into the guests array and add a new guest</span>
guests = [...guests, { ...guest, <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;March Hare&quot;</span> }];
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="49" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="overriding-properties">Overriding properties</h2>
<p>When spreading properties, it is possible to override as long as the spread comes before the new assignment.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> guest = { <span class="hljs-attr">place</span>: <span class="hljs-string">&quot;tea party&quot;</span>, <span class="hljs-attr">isLate</span>: <span class="hljs-literal">false</span> };

<span class="hljs-comment">// spread guest and override isLate when seating the White Rabbit</span>
<span class="hljs-keyword">const</span> rabbit = { ...guest, <span class="hljs-attr">isLate</span>: <span class="hljs-literal">true</span>, <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;White Rabbit&quot;</span> };

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(rabbit.<span class="hljs-property">isLate</span>); <span class="hljs-comment">// ~&gt; true</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="50" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="object-destructuring-on-function-arguments-defaults">Object destructuring on function arguments, defaults</h2>
<p>Object destructuring can be used with function parameters.</p>
<p>Defaults can be set on the destructured argument.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> <span class="hljs-title function_">seatGuest</span> = (<span class="hljs-params">{ place = <span class="hljs-string">&quot;tea party&quot;</span>, isLate = <span class="hljs-literal">false</span>, name } = {}</span>) =&gt; {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${name}</span> is at the <span class="hljs-subst">${place}</span> and is late: <span class="hljs-subst">${isLate}</span>`</span>);
};
<span class="hljs-title function_">seatGuest</span>({ <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span> });
<span class="hljs-comment">// ~&gt; Alice is at the tea party and is late: false</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="51" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="rest-operator">Rest operator</h2>
<p>The rest operator (<code>...</code>) is the inverse of spread. In destructuring, it gathers <strong>whatever is left</strong> into a new object or array.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> cake = {
  <span class="hljs-attr">cakeName</span>: <span class="hljs-string">&quot;Eat Me cake&quot;</span>,
  <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;pastry&quot;</span>,
  <span class="hljs-attr">isSweet</span>: <span class="hljs-literal">true</span>,
};

<span class="hljs-keyword">const</span> { cakeName, ...details } = cake;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(cakeName); <span class="hljs-comment">// ~&gt; Eat Me cake</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(details); <span class="hljs-comment">// ~&gt; { type: &quot;pastry&quot;, isSweet: true }</span>
</code></pre>
<p><strong>Spread</strong> copies properties <em>into</em> a new value. <strong>Rest</strong> collects remaining properties <em>out</em> of one.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-marpit-scope-pjBhrKOB="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="52" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="practice-destructuring--spread">Practice: Destructuring &amp; Spread</h2>
<div class="columns">
<div>
<p>Don't run it. Trace the syntax, then answer <strong>yes or no</strong>.</p>
<p><strong>After this runs, is <code>alice.pockets.drink</code> still <code>&quot;shrinking potion&quot;</code>?</strong></p>
<div data-marpit-fragment>
<p><strong>No.</strong> Rest and object spread copy the top level only. <code>pockets</code> is the same nested object, so mutating <code>tallerAlice.pockets</code> mutates <code>alice.pockets</code>. (<code>companions</code> <em>was</em> copied — <code>[...companions]</code> built a new array.)</p>
</div>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alice = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span>,
  <span class="hljs-attr">size</span>: <span class="hljs-string">&quot;small&quot;</span>,
  <span class="hljs-attr">pockets</span>: {
    <span class="hljs-attr">drink</span>: <span class="hljs-string">&quot;shrinking potion&quot;</span>,
    <span class="hljs-attr">cake</span>: <span class="hljs-string">&quot;Eat Me&quot;</span>,
  },
  <span class="hljs-attr">companions</span>: [<span class="hljs-string">&quot;White Rabbit&quot;</span>, <span class="hljs-string">&quot;Cheshire Cat&quot;</span>],
};

<span class="hljs-keyword">const</span> { pockets, companions, ...identity } = alice;

<span class="hljs-keyword">const</span> tallerAlice = {
  ...identity,
  <span class="hljs-attr">size</span>: <span class="hljs-string">&quot;tall&quot;</span>,
  pockets,
  <span class="hljs-attr">companions</span>: [...companions, <span class="hljs-string">&quot;Mad Hatter&quot;</span>],
};

tallerAlice.<span class="hljs-property">pockets</span>.<span class="hljs-property">drink</span> = <span class="hljs-string">&quot;empty bottle&quot;</span>;
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="53" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="destructuring-reference">Destructuring reference</h2>
<p><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring">https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="54" style="--paginate:true;--class:invert;--theme:default;" data-marpit-pagination-total="63">
<h1 id="modules">Modules</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="55" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="why-modules">Why Modules?</h2>
<p>Modules help you:</p>
<ul>
<li><strong>Organize code</strong> into logical units</li>
<li><strong>Reuse code</strong> across files</li>
<li><strong>Avoid naming conflicts</strong></li>
<li><strong>Control what's public/private</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="56" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="importing-and-exporting-modules">Importing and exporting modules</h2>
<p><strong>Modules are a central concept in JavaScript.</strong></p>
<p>Modules are file-based. Data and functionality can be explicitly exported and made public using the <strong>export statement</strong> from within a module.</p>
<p>There are two main module systems in JS:</p>
<ul>
<li><strong>CommonJS</strong></li>
<li><strong>ECMAScript Modules (ESM)</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="57" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="commonjs">CommonJS</h2>
<p>CommonJS was the original module management system for Node. Generally this style is deprecated in favor of ESM (which Node fully supports), but it is still commonly seen.</p>
<p>CommonJS uses the <code>module.exports</code> property to export from a module and <code>require()</code> to import that module from another file.</p>
<p>CommonJS is typically only used outside the browser context (typically on the server).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="58" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="commonjs-example">CommonJS Example</h2>
<p><em>Avoid this style in favor of ESM (which Node supports)!</em></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// cheshire.js</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">grin</span> = (<span class="hljs-params"></span>) =&gt; {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;We&#x27;re all mad here.&quot;</span>);
};

<span class="hljs-variable language_">module</span>.<span class="hljs-property">exports</span> = grin;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// index.js</span>
<span class="hljs-keyword">const</span> grin = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;./cheshire&quot;</span>);
<span class="hljs-title function_">grin</span>(); <span class="hljs-comment">// ~&gt; We&#x27;re all mad here.</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="59" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="ecmascript-modules-esm">ECMAScript modules (ESM)</h2>
<p>ESM is the <strong>official JS module system</strong>.</p>
<p>ESM is designed to work <strong>both in the browser and on the server</strong>.</p>
<p>ESM allows exporting items from a file using the <code>export</code> statement and importing them using the <code>import</code> statement. Object destructuring is commonly used when importing module items.</p>
<p>ESM supports <strong>named exports</strong> of individual items and <strong>default exports</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-marpit-scope-b8PzqnTF="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="60" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="esm-export-example">ESM export example</h2>
<p>Use the <code>export</code> keyword to export anything from a file.</p>
<p>Use <code>export default</code> to define the default export.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// tea.js</span>

<span class="hljs-comment">// named export</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> defaultBlend = <span class="hljs-string">&quot;earl grey&quot;</span>;

<span class="hljs-comment">// named export (function)</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">pourTea</span> = (<span class="hljs-params">{ blend, guest }</span>) =&gt; {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Pouring <span class="hljs-subst">${blend}</span> for <span class="hljs-subst">${guest}</span>`</span>);
};

<span class="hljs-comment">// default export, class</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TeaParty</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params">{ blend = defaultBlend, guest } = {}</span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">blend</span> = blend;
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">guest</span> = guest;
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="61" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="esm-import-example">ESM import example</h2>
<p>Use the <code>import</code> keyword to import items from another module.</p>
<p>The <code>default export</code> (the <code>TeaParty</code> class) does not need to be destructured but the non-default exports do.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// import named exports</span>
<span class="hljs-keyword">import</span> { defaultBlend, pourTea } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./tea.js&quot;</span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// import default export</span>
<span class="hljs-keyword">import</span> <span class="hljs-title class_">TeaParty</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./tea.js&quot;</span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// import both</span>
<span class="hljs-keyword">import</span> <span class="hljs-title class_">TeaParty</span>, { defaultBlend, pourTea } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./tea.js&quot;</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-GQEcZnKI="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="62" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:38%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/alice_keyhole.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="62%" height="720"><section id="62" data-marpit-scope-GQEcZnKI="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="62" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:38%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="summary">Summary</h2>

<p>Functions and data still swim in the same pool.</p>
<ul>
<li><strong>Functions</strong> are first-class: declarations, expressions, and arrows. Pass them, return them, nest them.</li>
<li><strong><code>this</code></strong> is decided at the <strong>call site</strong>, not stored on the function. Arrows keep lexical <code>this</code>. <code>.bind()</code> locks a regular function.</li>
<li><strong>Closures</strong> keep enclosing scope after the outer function returns — Node callbacks, React handlers.</li>
<li><strong>Async</strong> is built in: single-threaded + event loop. Callbacks → promises → <code>async/await</code>. <code>Promise.all</code> for independent work.</li>
<li><strong>Syntax</strong>: chain <code>map</code>/<code>filter</code>/<code>reduce</code>; destructure; spread <em>into</em> and rest <em>out of</em>. Spread copies the top level only.</li>
<li><strong>Modules</strong>: prefer <strong>ESM</strong> (<code>import</code>/<code>export</code>) over CommonJS (<code>require</code>/<code>module.exports</code>). Named vs default exports.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-GQEcZnKI="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="62" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="63" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">

</section>
