</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-BWCMAyMP="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="4" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:38%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/alice_pool_of_tears.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="62%" height="720"><section id="4" data-marpit-scope-BWCMAyMP="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="4" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:38%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="all-is-water">All is water</h2>

<p>After a sip from a mysterious bottle, Alice shrinks — then weeps a pool of tears so deep she has to swim in it. A mouse, a dodo, and a crowd of curious creatures tumble in too. Everything that was separate on land is now mixed in the same water.</p>
<p><strong>JavaScript is (like) that pool.</strong></p>
<p><strong>What could I possibly mean by that?</strong></p>
<div data-marpit-fragment>
<p><strong>In JavaScript, data and functions swim in the same medium.</strong> Objects and data can be deconstructed, reconstructed, and recombined in endless combinations.</p>
<p>Functionality and data are mixed. Functions can be passed around like any other piece of data and can maintain data and context through multiple invocations.</p>
<p><strong>This can be a paradigm shift for developers coming from more object-oriented languages, which rely on more rigid class hierarchies and inheritance.</strong></p>
</div>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-BWCMAyMP="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="4" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-GoVmviYx="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="5" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">

<h1 id="functions">Functions</h1>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="6" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="7" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="why-functions-matter">Why Functions Matter</h2>
<p>Functions are important for many reasons we are already familiar with. They allow you to:</p>
<ul>
<li><strong>Reuse code</strong> and avoid repetition</li>
<li><strong>Organize logic</strong> into manageable pieces</li>
</ul>
<p>In JS, functions take a more central role and allow us to easily:</p>
<ul>
<li><strong>Pass behavior</strong> as data (first-class functions)</li>
<li><strong>Handle event-based systems</strong>, i.e. UIs, via callbacks and event handlers</li>
<li><strong>Handle asynchronous code efficiently and understandably</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="8" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/alice_drink_me.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="65%" height="720"><section id="8" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="8" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="js-function-basics">JS function basics</h2>

<p>JS functions can look very familiar. In this simple example we see a function which takes a parameter and returns a value.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">greet</span>(<span class="hljs-params">name</span>) {
  <span class="hljs-keyword">return</span> <span class="hljs-string">`Hello, <span class="hljs-subst">${name}</span>! Welcome to wonderland.`</span>;
}

<span class="hljs-comment">// Usage</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">greet</span>(<span class="hljs-string">&quot;Alice&quot;</span>)); <span class="hljs-comment">// &quot;Hello, Alice! Welcome to wonderland.&quot;</span>
</code></pre>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="8" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-dumLZPjj="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="9" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="js-functions-alternate-syntaxes">JS functions, alternate syntaxes</h2>
<p>JS functions can be defined using alternative syntaxes:</p>
<h4 id="function-declaration-hoisted">Function Declaration (Hoisted)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">greet</span>(<span class="hljs-params">name</span>) {
  <span class="hljs-keyword">return</span> <span class="hljs-string">`Hello, <span class="hljs-subst">${name}</span>!`</span>;
}
</code></pre>
<h4 id="function-expression-not-hoisted">Function Expression (Not hoisted)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> greet = <span class="hljs-keyword">function</span> (<span class="hljs-params">name</span>) {
  <span class="hljs-keyword">return</span> <span class="hljs-string">`Hello, <span class="hljs-subst">${name}</span>!`</span>;
};
</code></pre>
<h4 id="arrow-function-es6">Arrow Function (ES6+)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// automatic return</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">greet</span> = (<span class="hljs-params">name</span>) =&gt; <span class="hljs-string">`Hello, <span class="hljs-subst">${name}</span>!`</span>; <span class="hljs-comment">// with/without parens</span>
<span class="hljs-comment">// explicit return</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">greet</span> = (<span class="hljs-params">name</span>) =&gt; {
  <span class="hljs-keyword">return</span> <span class="hljs-string">`Hello, <span class="hljs-subst">${name}</span>!`</span>;
};
</code></pre>
<p><strong>Exercise:</strong> <code>/01_function_syntax.txt</code> — run it, then fix the two bugs.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-2G8z5Sqa="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="10" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="anonymous-functions--first-class-functions">Anonymous functions &amp; First-Class Functions</h2>
<div class="columns">
<div>
<ul>
<li>Unlike programming languages like C#, functions are commonly treated as <strong>first-class objects</strong> in JS</li>
<li>Functions can be <strong>passed to other functions</strong> and <strong>returned by functions</strong></li>
<li>This enables powerful patterns like <strong>higher-order functions</strong></li>
</ul>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> <span class="hljs-title function_">welcome</span> = (<span class="hljs-params">name</span>) =&gt; <span class="hljs-string">`Welcome to Wonderland, <span class="hljs-subst">${name}</span>!`</span>;

<span class="hljs-keyword">function</span> <span class="hljs-title function_">greet</span>(<span class="hljs-params">fn</span>) {
  <span class="hljs-keyword">return</span> <span class="hljs-title function_">fn</span>(<span class="hljs-string">&quot;Alice&quot;</span>);
}

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">greet</span>(welcome));
<span class="hljs-comment">// Welcome to Wonderland, Alice!</span>

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">greet</span>(<span class="hljs-function">(<span class="hljs-params">n</span>) =&gt;</span> <span class="hljs-string">`We&#x27;re all mad here, <span class="hljs-subst">${n}</span>!`</span>));
<span class="hljs-comment">// We&#x27;re all mad here, Alice!</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-E4DXw5HA="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="11" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/alice_too_big.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="11" data-marpit-scope-E4DXw5HA="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="11" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">

<h2 id="understanding-the-output">Understanding the Output</h2>
<p><strong>What's happening:</strong></p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="13" style="--paginate:true;--class:invert;--theme:default;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/this_binding.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="13" data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="13" style="--paginate:true;--class:invert;--theme:default;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="this-binding-closures"><code>this</code>, binding, closures</h1>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="13" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-CBmvaOhh="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="14" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="guess-the-output--dont-run-it">Guess the output — don't run it</h2>
<p>It's the <strong>same <code>greet</code> function</strong> every time. What do the three logs print?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alice = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span>,
  <span class="hljs-title function_">greet</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">name</span>);
  },
};

alice.<span class="hljs-title function_">greet</span>();

<span class="hljs-keyword">const</span> greet = alice.<span class="hljs-property">greet</span>;
<span class="hljs-title function_">greet</span>();

<span class="hljs-keyword">const</span> hatter = { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Mad Hatter&quot;</span>, greet };
hatter.<span class="hljs-title function_">greet</span>();
</code></pre>
<p>Write down all three, then compare with a partner.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-RSwzW3BW="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="15" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="understanding-the-output-1">Understanding the output</h2>
<p><code>this</code> is <strong>not</strong> stored on the function. It is decided <strong>when the function is called</strong>.</p>
<ol>
<li><code>alice.greet()</code> → <strong><code>Alice</code></strong> — called as a method of <code>alice</code>, so <code>this</code> is <code>alice</code></li>
<li><code>greet()</code> → <strong><code>undefined</code></strong> — extracted and called with no object; <code>this</code> is lost</li>
<li><code>hatter.greet()</code> → <strong><code>Mad Hatter</code></strong> — same function, now called as a method of <code>hatter</code></li>
</ol>
<p>The function never belonged to Alice. Whoever is left of the <code>.</code> at the call site becomes <code>this</code>.</p>
<p><strong>Regular functions</strong> use that call-site rule. <strong>Arrow functions</strong> ignore it — they keep <code>this</code> from the surrounding (lexical) scope.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-jcao9bYy="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="16" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="this-in-c-vs-javascript"><code>this</code> in C# vs JavaScript</h2>
<p>C# binds <code>this</code> to the <strong>instance</strong>. JS binds <code>this</code> to <strong>how the function is called</strong>.</p>
<div class="columns">
<div>
<p><strong>C# — the instance is baked in</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">class</span> <span class="hljs-title">Character</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-built_in">string</span> Name { <span class="hljs-keyword">get</span>; <span class="hljs-keyword">set</span>; }
  <span class="hljs-function"><span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Greet</span>()</span> =&gt;
    Console.WriteLine(<span class="hljs-keyword">this</span>.Name);
}

<span class="hljs-keyword">var</span> alice = <span class="hljs-keyword">new</span> Character { Name = <span class="hljs-string">&quot;Alice&quot;</span> };
alice.Greet();           <span class="hljs-comment">// Alice</span>

Action greet = alice.Greet;
greet();                 <span class="hljs-comment">// Alice  <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></span>
</code></pre>
</div>
<div>
<p><strong>JS — decided at the call site</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alice = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span>,
  <span class="hljs-title function_">greet</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">name</span>);
  },
};

alice.<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// Alice</span>

<span class="hljs-keyword">const</span> greet = alice.<span class="hljs-property">greet</span>;
<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// undefined  <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></span>
</code></pre>
</div>
</div>
<p>Extracting a C# method keeps <code>this</code>. Extracting a JS method <strong>loses</strong> it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-M8riMMs6="" data-paginate="true" data-class="lead" data-footer="**Lexical:** decided by where the code is written, not how it is called." data-theme="default" lang="en-US" class="lead" data-marpit-pagination="17" style="--paginate:true;--class:lead;--footer:**Lexical:** decided by where the code is written, not how it is called.;--theme:default;" data-marpit-pagination-total="63">
<h2 id="arrow-functions-ignore-the-call-site">Arrow functions ignore the call site</h2>
<p>Same calls, different <code>this</code>. The arrow never becomes Alice or the Hatter.</p>
<div class="columns">
<div>
<p><strong>Regular — follows the caller</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alice = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span>,
  <span class="hljs-title function_">greet</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">name</span>);
  },
};

alice.<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// Alice</span>

<span class="hljs-keyword">const</span> hatter = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Mad Hatter&quot;</span>,
  <span class="hljs-attr">greet</span>: alice.<span class="hljs-property">greet</span>,
};
hatter.<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// Mad Hatter</span>
</code></pre>
</div>
<div>
<p><strong>Arrow — locked where it was written</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alice = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span>,
  <span class="hljs-attr">greet</span>: <span class="hljs-function">() =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">name</span>);
  },
};

alice.<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// undefined</span>

<span class="hljs-keyword">const</span> hatter = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Mad Hatter&quot;</span>,
  <span class="hljs-attr">greet</span>: alice.<span class="hljs-property">greet</span>,
};
hatter.<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// undefined</span>
</code></pre>
</div>
</div>
<p>An arrow's <code>this</code> is <strong>lexical</strong>. Moving it to another object does not rebind it.</p>
<footer><strong>Lexical:</strong> decided by where the code is written, not how it is called.</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-HUgynMVt="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="18" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="bind"><code>.bind()</code></h2>
<p><strong>Binding</strong> is attaching a function to a specific <code>this</code> — the object it should use as its context when it runs.</p>
<p><code>.bind(object)</code> returns a <strong>new function</strong> with <code>this</code> locked to that object. Call it later — no object on the left of <code>.</code> needed.</p>
<div class="columns">
<div>
<p><strong>Regular — <code>this</code> stays locked</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alice = { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span> };

<span class="hljs-keyword">const</span> greet = <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">name</span>);
}.<span class="hljs-title function_">bind</span>(alice);

<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// Alice</span>
</code></pre>
</div>
<div>
<p><strong>Arrow — <code>.bind()</code> is ignored</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> alice = { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span> };

<span class="hljs-keyword">const</span> greet = (<span class="hljs-function">() =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">name</span>);
}).<span class="hljs-title function_">bind</span>(alice);

<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// undefined</span>
</code></pre>
</div>
</div>
<p><code>.bind()</code> can fix a regular function's <code>this</code>. It cannot override an arrow's lexical <code>this</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-Dro57Zbw="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="19" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="closures">Closures</h2>
<div class="columns">
<div>
<p>Functions in JS are able to &quot;see&quot; (keep in scope) their surrounding context, even after the outer function has completed execution.</p>
<p>A <strong>closure is the binding of a function with its enclosing scope</strong>.</p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">queenOfHearts</span>(<span class="hljs-params">name</span>) {
  <span class="hljs-keyword">const</span> decree = name === <span class="hljs-string">&quot;Alice&quot;</span> ? <span class="hljs-string">&quot;Off with her head!&quot;</span> : <span class="hljs-string">&quot;Off with his head!&quot;</span>;

  <span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(decree), <span class="hljs-number">1000</span>);
}

<span class="hljs-title function_">queenOfHearts</span>(<span class="hljs-string">&quot;Alice&quot;</span>); <span class="hljs-comment">// Off with her head!</span>
<span class="hljs-title function_">queenOfHearts</span>(<span class="hljs-string">&quot;the Knave&quot;</span>); <span class="hljs-comment">// Off with his head!</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-EGBcSYDG="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="20" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="closures-in-node">Closures in Node</h2>
<div class="columns">
<div>
<p>Each incoming request is handled by a <strong>callback</strong>. That callback still sees <code>accused</code> — even though <code>startCourt</code> has already finished.</p>
<p><strong>Closures are how Node keeps setup data (config, a name, a db connection) across later requests.</strong></p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> http = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;http&quot;</span>);

<span class="hljs-keyword">function</span> <span class="hljs-title function_">startCourt</span>(<span class="hljs-params">accused</span>) {
  http
    .<span class="hljs-title function_">createServer</span>(<span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {
      res.<span class="hljs-title function_">end</span>(<span class="hljs-string">`Off with <span class="hljs-subst">${accused}</span>&#x27;s head!`</span>);
    })
    .<span class="hljs-title function_">listen</span>(<span class="hljs-number">3000</span>);
}

<span class="hljs-title function_">startCourt</span>(<span class="hljs-string">&quot;Alice&quot;</span>);
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-LsVFZOqq="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="21" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="closures-in-react">Closures in React</h2>
<div class="columns">
<div>
<p>A click happens later — long after the component function has returned.</p>
<p>The event handler still sees <code>name</code> from that render.</p>
<p><strong>Closures are how React handlers keep the props they were created with.</strong></p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-jsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">SentenceButton</span>(<span class="hljs-params">{ name }</span>) {
  <span class="hljs-keyword">function</span> <span class="hljs-title function_">handleClick</span>(<span class="hljs-params"></span>) {
    <span class="hljs-title function_">alert</span>(<span class="hljs-string">`Off with <span class="hljs-subst">${name}</span>&#x27;s head!`</span>);
  }

  <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">onClick</span>=<span class="hljs-string">{handleClick}</span>&gt;</span>Sentence {name}<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span></span>;
}
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-opEK8sie="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="22" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h3 id="exercise-debug-the-queens-court--10-minutes">Exercise: debug the Queen's Court — 10 minutes</h3>
<p>Open <code>/04_court/</code>, run <code>node server.js</code>, open <a href="http://localhost:3000">http://localhost:3000</a>. <strong>Don't use AI.</strong></p>
<p><strong>Two bugs</strong></p>
<ol>
<li><strong>Sentence Alice</strong> → <code>Off with Alice's head! (undefined)</code> — should be <code>(Wonderland)</code></li>
<li><strong>Hear ye</strong> → <code>undefined says: Off with their heads!</code> — should name the Queen</li>
</ol>
<p>With a partner: where is <code>this</code> lost? Fix with <code>.bind(...)</code> or by calling the method on the object.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-B1gFapbX="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="23" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="why-it-broke">Why it broke</h2>
<p>Same rule on the client and the server: <strong>whoever is left of the <code>.</code> at the call site is <code>this</code>.</strong> Extract the method, and <code>this</code> is gone.</p>
<ol>
<li>
<p><strong>Hear ye</strong> — <code>addEventListener</code> calls <code>announce()</code> with no object, so <code>this</code> is the button.<br />
Fix: <code>queen.announce.bind(queen)</code> or <code>() =&gt; queen.announce()</code></p>
</li>
<li>
<p><strong><code>(undefined)</code> instead of <code>(Wonderland)</code></strong> — <code>const handleSentence = court.sentence</code> extracts the method. The server calls <code>handleSentence(req, res)</code> with no object, so <code>this.place</code> is lost.<br />
Fix: <code>court.sentence.bind(court)</code> or <code>court.sentence(req, res)</code></p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="24" style="--paginate:true;--class:invert;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/async_programming.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="24" data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="24" style="--paginate:true;--class:invert;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="asynchronous-programming">Asynchronous Programming</h1>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="24" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="25" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="why-async-programming">Why Async Programming?</h2>
<p>JavaScript is <strong>single-threaded</strong> - it can only do one thing at a time. Without async programming:</p>
<ul>
<li><strong>Blocking operations</strong> (network calls, database calls, file I/O) would freeze the entire application</li>
<li><strong>User interfaces</strong> would become unresponsive</li>
</ul>
<p>Async programming and the event loop allow JavaScript to handle multiple things <em><strong>concurrently</strong></em>.</p>
<p>Unlike many other popular programming languages (C#, Java, PHP), <strong>async functionality is built into JavaScript and is an essential part of most JS codebases</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="26" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/nodejs-eventloop.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="26" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63" data-marpit-advanced-background="content"></section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="26" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="27" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="the-event-loop">The Event Loop</h2>
<p>The event loop allows a single-threaded JS agent to manage asynchronous events.</p>
<p>Parts of the event loop:</p>
<ol>
<li><strong>Call Stack</strong> – JavaScript runs functions here in a last-in, first-out (LIFO) order.</li>
<li><strong>Task Queue</strong> – Asynchronous tasks (like setTimeout, I/O, or events) wait here until the stack is empty.</li>
<li><strong>Microtask Queue</strong> – High-priority tasks (like resolved Promises) are processed before the regular task queue.</li>
<li><strong>Event Loop</strong> – Keeps checking if the call stack is empty, then moves tasks from the queues to the stack for execution.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="28" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="callbacks">Callbacks</h2>
<p>There are three main ways to deal with async code: <code>callbacks</code>, <code>promises</code> and <code>async/await</code>.</p>
<p>Callbacks are the oldest style. They work by passing a function to another function. After the asynchronous action is complete, the callback function is called.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-mOpCbgVx="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="29" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h3 id="exercise-callback-order--dont-run-it">Exercise: callback order — don't run it</h3>
<p>Open <code>/05_white_rabbit.js</code>. <strong>Don't run it or use AI.</strong></p>
<p>Alice makes a <strong>real HTTP request</strong>, then a <strong>second request</strong> that depends on the first.</p>
<ol>
<li>Find every callback (there are more than two)</li>
<li>Write down the order of the <code>console.log</code> lines</li>
<li>Compare with a partner</li>
<li>Run <code>node 05_white_rabbit.js</code> and check</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-zdfY9FKZ="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="30" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="callback-output-order">Callback output order</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Alice: I'll ask the catalog for a reader.
Alice: Meanwhile I'll look around the stacks.
Catalog: Leanne Graham
Catalog: first title is sunt aut facere ...
</code></pre>
<p><strong>What's happening:</strong></p>
<ol>
<li>First log runs immediately — <code>getJson</code> <em>starts</em> the request and returns</li>
<li>The &quot;Meanwhile&quot; log runs while the network is still in flight</li>
<li>When the reader arrives, that callback runs and starts the titles request</li>
<li>When the titles arrive, the nested callback runs</li>
</ol>
<p>The second request lives <em>inside</em> the first callback, so it cannot start until the first response is in. That nesting is the start of callback hell.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-i69rHZk2="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="31" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/callback_hell.jpeg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="31" data-marpit-scope-i69rHZk2="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="31" style="--paginate:true;--class:lead;--theme:default;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="callback-overuse">Callback overuse</h2>

<p><strong>Problems with excessive callback nesting:</strong></p>
<ul>
<li>Hard to read and maintain</li>
<li>Error handling is difficult</li>
<li>Code becomes deeply nested</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-i69rHZk2="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="31" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="32" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="promises">Promises</h2>
<p>The Promise object represents the eventual completion (or failure) of an asynchronous operation and its resulting value.</p>
<p>Promises can be in one of three states:</p>
<ul>
<li><code>pending</code>: The promise has not completed.</li>
<li><code>fulfilled</code>: The promise completed successfully.</li>
<li><code>rejected</code>: The promise failed.</li>
</ul>
<p>Promises have three main methods:</p>
<ul>
<li><code>.then()</code>: Invoked after successful completion</li>
<li><code>.catch()</code>: Invoked if an error occurs</li>
<li><code>.finally()</code>: Invoked on success <em>or</em> error</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="33" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="%F0%9F%94%97-promise-chaining"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Promise Chaining</h2>
<p>Promises can be chained to avoid callback nesting.</p>
<p>The return value of the first <code>.then()</code> is passed as the first argument to the subsequent <code>.then()</code>.</p>
<p>An error anywhere in the chain stops execution and goes directly to the <code>catch()</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-title function_">askCheshireCat</span>()
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">cat</span>) =&gt;</span> <span class="hljs-title function_">findMadHatter</span>(cat.<span class="hljs-property">direction</span>))
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">hatter</span>) =&gt;</span> <span class="hljs-title function_">followWhiteRabbit</span>(hatter.<span class="hljs-property">hint</span>))
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">rabbit</span>) =&gt;</span> <span class="hljs-title function_">enterQueensCourt</span>(rabbit.<span class="hljs-property">hole</span>))
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">court</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Alice arrives at:&quot;</span>, court.<span class="hljs-property">name</span>))
  .<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">error</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Lost in Wonderland:&quot;</span>, error));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-vif9lAtr="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="34" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h3 id="exercise-callbacks-vs-promises--dont-run-it">Exercise: callbacks vs promises — don't run it</h3>
<p>Open <code>/05_white_rabbit.js</code> and <code>/06_white_rabbit_promise.js</code>.</p>
<p>Same two catalog requests. One uses callbacks; one uses promises. With a partner, answer:</p>
<ol>
<li>How did <code>getJson</code>'s <strong>signature</strong> change? What does it return now?</li>
<li>Where did the <strong>nesting</strong> go? What does <code>return getJson(...)</code> in the first <code>.then()</code> do?</li>
<li>How is <strong>error handling</strong> different? What happens if the first request fails in each version?</li>
<li>The promise file has <code>.finally()</code>. When does that log run — success, failure, or both?</li>
<li>Does using promises make Alice <strong>wait</strong>? Will she still look around the stacks before the catalog replies?</li>
<li>Write down the <code>console.log</code> <strong>order</strong>, then run <code>node 06_white_rabbit_promise.js</code> and check</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-l5Qhchhc="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="35" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="promiseall">Promise.all()</h2>
<p><code>Promise.all()</code> waits for many <strong>independent</strong> promises at once. They all <strong>start immediately</strong>. You get one result when every one of them has finished (or one error if any of them fails).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">all</span>([<span class="hljs-title function_">askCheshireCat</span>(), <span class="hljs-title function_">visitMadHatter</span>(), <span class="hljs-title function_">findWhiteRabbit</span>()])
  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">[cat, hatter, rabbit]</span>) =&gt;</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(cat.<span class="hljs-property">grin</span>, hatter.<span class="hljs-property">riddle</span>, rabbit.<span class="hljs-property">excuse</span>);
  })
  .<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">error</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Lost in Wonderland:&quot;</span>, error));
</code></pre>
<p><strong>Concurrency vs parallelism</strong></p>
<ul>
<li><strong>Concurrency</strong> — overlapping work on <strong>one</strong> thread. <code>Promise.all</code> is concurrent: the event loop waits on several I/O operations at the same time. JS still executes one line at a time.</li>
<li><strong>Parallelism</strong> — multiple cores actually running at the same time. The main JS thread does not do this.</li>
</ul>
<p>For true parallelism, JavaScript supports <strong>Web Workers</strong> (and <code>worker_threads</code> in Node): separate threads for CPU-heavy work, so the event loop stays free.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-scope-r9hBgP62="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="36" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="asyncawait">async/await</h2>
<p><code>async</code>/<code>await</code> is syntax on top of promises. Same event loop, same three states — code that reads top to bottom.</p>
<ul>
<li><strong><code>async</code></strong> — marks a function. It always returns a Promise.</li>
<li><strong><code>await</code></strong> — pauses <em>that function</em> until the Promise settles, then gives you the value. The rest of the program keeps running.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">enterWonderland</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> rabbit = <span class="hljs-keyword">await</span> <span class="hljs-title function_">followWhiteRabbit</span>();
  <span class="hljs-keyword">const</span> court = <span class="hljs-keyword">await</span> <span class="hljs-title function_">enterQueensCourt</span>(rabbit.<span class="hljs-property">hole</span>);
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Alice arrives at:&quot;</span>, court.<span class="hljs-property">name</span>);
}

<span class="hljs-title function_">enterWonderland</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Alice: Meanwhile I&#x27;ll look around.&quot;</span>);
</code></pre>
<p><code>await</code> is only legal inside an <code>async</code> function (or at the top level of a module).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-BU2lwfta="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="37" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="from-then-to-await">From <code>.then()</code> to <code>await</code></h2>
<p>Same Cheshire Cat chain. Each <code>await</code> is one <code>.then()</code>. Sequential awaits wait <strong>in order</strong> — like a promise chain.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">findTheCourt</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> cat = <span class="hljs-keyword">await</span> <span class="hljs-title function_">askCheshireCat</span>();
  <span class="hljs-keyword">const</span> hatter = <span class="hljs-keyword">await</span> <span class="hljs-title function_">findMadHatter</span>(cat.<span class="hljs-property">direction</span>);
  <span class="hljs-keyword">const</span> rabbit = <span class="hljs-keyword">await</span> <span class="hljs-title function_">followWhiteRabbit</span>(hatter.<span class="hljs-property">hint</span>);
  <span class="hljs-keyword">const</span> court = <span class="hljs-keyword">await</span> <span class="hljs-title function_">enterQueensCourt</span>(rabbit.<span class="hljs-property">hole</span>);
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Alice arrives at:&quot;</span>, court.<span class="hljs-property">name</span>);
}

<span class="hljs-title function_">findTheCourt</span>().<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">error</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Lost in Wonderland:&quot;</span>, error));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-j8LeYgdp="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="38" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="try--catch--finally">try / catch / finally</h2>
<p><code>await</code> throws when a Promise rejects, so you can use ordinary <code>try</code> / <code>catch</code> / <code>finally</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">findTheCourt</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">try</span> {
    <span class="hljs-keyword">const</span> cat = <span class="hljs-keyword">await</span> <span class="hljs-title function_">askCheshireCat</span>();
    <span class="hljs-keyword">const</span> hatter = <span class="hljs-keyword">await</span> <span class="hljs-title function_">findMadHatter</span>(cat.<span class="hljs-property">direction</span>);
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Alice arrives at:&quot;</span>, hatter.<span class="hljs-property">table</span>);
  } <span class="hljs-keyword">catch</span> (error) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Lost in Wonderland:&quot;</span>, error);
  } <span class="hljs-keyword">finally</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;The court is always watching.&quot;</span>);
  }
}
</code></pre>
<ul>
<li><code>try</code> — success path (<code>.then()</code>)</li>
<li><code>catch</code> — any rejection in the <code>try</code> (<code>.catch()</code>)</li>
<li><code>finally</code> — always runs (<code>.finally()</code>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="39" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">

<li>Review the async/await implementation of the White Rabbit <code>07_white_rabbit_async.js</code></li>
<li>What changed from the Promise implementation?</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-class="invert" data-theme="default" lang="en-US" class="invert" data-marpit-pagination="40" style="--paginate:true;--class:invert;--theme:default;" data-marpit-pagination-total="63">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-2WS7x6O3="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="41" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="array-challenge">Array Challenge</h2>
<p>From the Mad Hatter's tea table, I want a new array with only the names of the sweet pastries. How?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> food = [
  {
    <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;jam tart&quot;</span>,
    <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;pastry&quot;</span>,
    <span class="hljs-attr">isSweet</span>: <span class="hljs-literal">true</span>,
  },
  {
    <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Eat Me cake&quot;</span>,
    <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;pastry&quot;</span>,
    <span class="hljs-attr">isSweet</span>: <span class="hljs-literal">true</span>,
  },
  {
    <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;bread-and-butter&quot;</span>,
    <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;pastry&quot;</span>,
    <span class="hljs-attr">isSweet</span>: <span class="hljs-literal">false</span>,
  },
  {
    <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;turtle soup&quot;</span>,
    <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;soup&quot;</span>,
    <span class="hljs-attr">isSweet</span>: <span class="hljs-literal">false</span>,
  },
];
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-scope-ltQYJDwR="" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="42" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="solution-for-loop">Solution: <code>for</code> loop</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> sweetPastryNames = [];

<span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; food.<span class="hljs-property">length</span>; i++) {
  <span class="hljs-keyword">const</span> item = food[i];

  <span class="hljs-keyword">if</span> (item.<span class="hljs-property">type</span> === <span class="hljs-string">&quot;pastry&quot;</span> &amp;&amp; item.<span class="hljs-property">isSweet</span>) {
    sweetPastryNames.<span class="hljs-title function_">push</span>(item.<span class="hljs-property">name</span>);
  }
}

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(sweetPastryNames); <span class="hljs-comment">// [&quot;jam tart&quot;, &quot;Eat Me cake&quot;]</span>
</code></pre>
<p>Is this a good solution?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="43" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
<h2 id="solution-array-methods">Solution: Array Methods</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> sweetPastryNames = food
  .<span class="hljs-title function_">filter</span>(<span class="hljs-function">(<span class="hljs-params">item</span>) =&gt;</span> item.<span class="hljs-property">type</span> === <span class="hljs-string">&quot;pastry&quot;</span> &amp;&amp; item.<span class="hljs-property">isSweet</span>)
  .<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">item</span>) =&gt;</span> item.<span class="hljs-property">name</span>);

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(sweetPastryNames); <span class="hljs-comment">// [&quot;jam tart&quot;, &quot;Eat Me cake&quot;]</span>
</code></pre>
<p><strong>What we did:</strong></p>
<ol>
<li><strong>Filtered</strong> for pastries that are sweet</li>
<li><strong>Mapped</strong> to get just the names</li>
<li><strong>Chained</strong> the methods together</li>
</ol>
<p>Is this a better option?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="44" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="63">
